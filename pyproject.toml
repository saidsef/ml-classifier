[project]
name = "ml-classifier"
version = "3.0.0"
description = "ML news classifier"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "flask-wtf==1.3.0",
    "numpy==2.5.4",
    "prometheus-flask-exporter==0.23.2",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "werkzeug>=3.1.9",
    "zipp>=4.1.0",
]

[dependency-groups]
docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.5",
    "pygments~=2.18",
    "pymdown-extensions~=12.3",
]
