site_name: ml-classifier
repo_url: https://github.com/saidsef/ml-classifier
strict: true
theme:
  name: material
  palette:
    primary: teal
  features:
  - content.code.copy
  - content.tabs.link
markdown_extensions:
- codehilite
- admonition
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: README.md
  - Architecture: architecture.md
  - Training the model: model.md
  - Service:
    - Running the service: running.md
    - API reference: api.md
  - Deployment:
    - Deploying on Kubernetes: deploying.md
    - Operations: operations.md
  - CI and releases: ci.md
